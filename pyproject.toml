[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmplan"
version = "0.1.0"
description = "Multi-agent path finding for drone swarms: CBS, ECBS, prioritised planning, anonymous assignment and delay-robust execution"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pratyush Vatsa" }]
keywords = ["mapf", "cbs", "ecbs", "path-planning", "drone-swarm", "multi-robot", "robotics"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
assign = ["scipy>=1.7"]
plots = ["matplotlib>=3.5", "pillow>=9.0"]
dev = ["pytest>=7.0", "scipy>=1.7", "matplotlib>=3.5", "pillow>=9.0"]

[project.scripts]
swarmplan = "swarmplan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
